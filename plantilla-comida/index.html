<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"cliente","type":"string","label":"Cliente (para el nombre del archivo)","default":"Cliente"},
    {"id":"producto","type":"string","label":"Producto","default":"Pastel de tres leches","maxLength":28},
    {"id":"gancho","type":"string","label":"Gancho (1–3 s, máx. 6 palabras)","default":"El más cremoso de la ciudad","maxLength":40},
    {"id":"detalle","type":"string","label":"Detalle elegante (Playfair Italic)","default":"hecho en casa cada mañana","maxLength":34},
    {"id":"frase","type":"string","label":"Frase bajo el producto","default":"Suave, frío y con canela","maxLength":34},
    {"id":"cta","type":"string","label":"CTA final","default":"Ven a probarlo hoy","maxLength":28},
    {"id":"cuenta","type":"string","label":"Cuenta / ubicación","default":"@turestaurante","maxLength":28},
    {"id":"color_acento","type":"color","label":"Color de acento (marca)","default":"#C8A96A"},
    {"id":"color_texto","type":"color","label":"Color del texto","default":"#F7F5F2"},
    {"id":"textos","type":"boolean","label":"Con textos (desactivar = versión limpia)","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Paleta y tipografías de la guía: Poppins Semibold (títulos), Poppins Regular (secundario), Playfair Display Italic (detalle).
         color_acento / color_texto son variables: cada marca pone los suyos. */
      :root { --ink: #0f0f0f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f0f0f; }
      #root { width: 100%; height: 100%; }
      video.toma { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* scrims suaves solo donde hay texto: no tapan la comida y no cambian su color */
      .scrim { position: absolute; left: 0; right: 0; height: 620px; pointer-events: none; }
            #scrim-top { background: linear-gradient(to bottom, rgba(15,15,15,.55) 0%, rgba(15,15,15,.35) 40%, rgba(15,15,15,.12) 75%, rgba(15,15,15,0) 100%); }
      #scrim-top { top: 0; }
      #scrim-bottom { background: linear-gradient(to top, rgba(15,15,15,.6) 0%, rgba(15,15,15,.42) 30%, rgba(15,15,15,.2) 60%, rgba(15,15,15,.06) 85%, rgba(15,15,15,0) 100%); }
      #scrim-bottom { top: 760px; height: 1160px; }

      /* textos dentro de la franja segura de Reels/TikTok: 168–1330 px en vertical, lejos de la columna de botones de la derecha */
      .txt { position: absolute; left: 120px; right: 200px; color: var(--color_texto, #F7F5F2); text-shadow: 0 2px 18px rgba(15,15,15,.45); }
      .txt .w { display: inline-block; }
      #t-gancho { top: 360px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 78px; line-height: 1.04; letter-spacing: -0.01em; }
      #t-detalle { top: 1150px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 54px; }
      #t-producto { bottom: 790px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 88px; line-height: 1.02; }
      #t-frase { top: 1150px; font-family: "Playfair Display", serif; font-style: italic; font-size: 54px; color: var(--color_acento, #C8A96A); }
      #t-cta { right: 300px; bottom: 790px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 72px; line-height: 1.04; }
      #t-cuenta { right: 300px; top: 1170px; font-family: "Poppins", sans-serif; font-weight: 400; font-size: 46px; color: var(--color_acento, #C8A96A); }
      #t-cta-line > div { position: absolute; left: 0; top: 0; width: 120px; height: 6px; border-radius: 3px; background: var(--color_acento, #C8A96A); }
      #t-cta-line { position: absolute; left: 120px; top: 1148px; width: 120px; height: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19" data-width="1080" data-height="1920">
      <!-- TOMAS: cambia cada src por tu clip (assets/clips/…). El sonido original (ASMR) se conserva: data-has-audio="true".
           data-media-start = segundo del clip desde el que empieza. Cortes: 2.5 · 4.5 · 6.5 · 8.5 · 10.5 s -->
      <video id="toma1" class="clip toma" src="assets/clips/clip1.mp4" data-start="0" data-duration="2.5" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <video id="toma2" class="clip toma" src="assets/clips/clip2.mp4" data-start="2.5" data-duration="2" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <video id="toma3" class="clip toma" src="assets/clips/clip3.mp4" data-start="4.5" data-duration="2" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <video id="toma4" class="clip toma" src="assets/clips/clip4.mp4" data-start="6.5" data-duration="2" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <video id="toma5" class="clip toma" src="assets/clips/clip5.mp4" data-start="8.5" data-duration="2" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <!-- toma final (resultado): ponla en cámara lenta con data-playback-rate="0.5" si el clip es de 60 fps -->
      <video id="toma6" class="clip toma" src="assets/clips/clip6.mp4" data-start="10.5" data-duration="8.5" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>

      <div id="scrim-top" class="clip scrim" data-start="0" data-duration="2.5" data-track-index="1" data-layout-ignore></div>
      <div id="scrim-bottom" class="clip scrim" data-start="4.5" data-duration="14.5" data-track-index="1" data-layout-ignore></div>

      <!-- TEXTOS (todos son variables) -->
      <h1 id="t-gancho" class="clip txt" data-start="0" data-duration="2.5" data-track-index="2"><span class="in" data-var-text="gancho">El más cremoso de la ciudad</span></h1>
      <p id="t-detalle" class="clip txt" data-start="4.6" data-duration="3.8" data-track-index="2"><span class="in" data-var-text="detalle">hecho en casa cada mañana</span></p>
      <h2 id="t-producto" class="clip txt" data-start="11.2" data-duration="4.4" data-track-index="2"><span class="in" data-var-text="producto">Pastel de tres leches</span></h2>
      <p id="t-frase" class="clip txt" data-start="11.6" data-duration="4" data-track-index="3"><span class="in" data-var-text="frase">Suave, frío y con canela</span></p>
      <div id="t-cta-line" class="clip" data-start="15.8" data-duration="3.2" data-track-index="4"><div class="in"></div></div>
      <h2 id="t-cta" class="clip txt" data-start="15.8" data-duration="3.2" data-track-index="2"><span class="in" data-var-text="cta">Ven a probarlo hoy</span></h2>
      <p id="t-cuenta" class="clip txt" data-start="16.1" data-duration="2.9" data-track-index="3"><span class="in" data-var-text="cuenta">@turestaurante</span></p>
    </div>
    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const conTextos = vars.textos !== false;
      const tl = gsap.timeline({ paused: true });
      const IN = (sel, at, d = 0.22) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: d, ease: "power4.out" }, at);
      const OUT = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, at);

      if (conTextos) {
        // gancho: ya en pantalla en el fotograma 0 (es la miniatura); solo se asienta
        tl.fromTo("#t-gancho .in", { opacity: 0.85, filter: "blur(2px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
        OUT("#t-gancho .in", 2.3);
        IN("#t-detalle .in", 4.65, 0.3); OUT("#t-detalle .in", 8.2);
        // resultado: nombre, luego la frase; el producto se queda quieto una vez llega
        IN("#t-producto .in", 11.25, 0.3); IN("#t-frase .in", 11.7, 0.3);
        OUT(["#t-producto .in", "#t-frase .in"], 15.4);
        // cierre: línea de acento, CTA y cuenta
        tl.fromTo("#t-cta-line .in", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 15.8);
        IN("#t-cta .in", 15.85, 0.3); IN("#t-cuenta .in", 16.15, 0.3);
        tl.fromTo("#scrim-bottom", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.5);
      } else {
        // versión limpia: sin textos ni sombras, solo las tomas y su sonido
        tl.set([".txt .in", "#t-cta-line .in", ".scrim"], { opacity: 0 }, 0);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
