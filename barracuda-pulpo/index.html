<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"cliente","type":"string","label":"Cliente (para el nombre del archivo)","default":"Barracuda"},
    {"id":"producto","type":"string","label":"Producto (para el nombre del archivo)","default":"Pulpo"},
    {"id":"gancho","type":"string","label":"Gancho (máx. 6 palabras)","default":"Recién salido de la cocina","maxLength":40},
    {"id":"cta","type":"string","label":"CTA final","default":"Reserva tu mesa","maxLength":28},
    {"id":"cuenta","type":"string","label":"Cuenta / ubicación","default":"Barracuda Gastro Bar","maxLength":28},
    {"id":"color_acento","type":"color","label":"Color de acento (marca)","default":"#C8A96A"},
    {"id":"color_texto","type":"color","label":"Color del texto","default":"#F7F5F2"},
    {"id":"textos","type":"boolean","label":"Con textos (desactivar = versión limpia)","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Basado en plantilla-comida: Poppins Semibold (títulos), Poppins Regular (secundario), Playfair Display Italic (detalle). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f0f0f; }
      #root { width: 100%; height: 100%; }
      video.toma { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      .scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
      #scrim-top { top: 0; height: 760px; background: linear-gradient(to bottom, rgba(15,15,15,.7) 0%, rgba(15,15,15,.45) 40%, rgba(15,15,15,.14) 75%, rgba(15,15,15,0) 100%); }
      #scrim-bottom { top: 760px; height: 1160px; background: linear-gradient(to top, rgba(15,15,15,.72) 0%, rgba(15,15,15,.5) 30%, rgba(15,15,15,.2) 60%, rgba(15,15,15,.06) 85%, rgba(15,15,15,0) 100%); }

      /* franja segura de Reels/TikTok: 168–1330 px, lejos de la columna de botones */
      .txt { position: absolute; left: 120px; right: 200px; color: var(--color_texto, #F7F5F2); text-shadow: 0 2px 18px rgba(15,15,15,.5); }
      #t-gancho { top: 360px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 84px; line-height: 1.04; letter-spacing: -0.01em; text-wrap: balance; }
      #t-cta { right: 300px; bottom: 810px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 76px; line-height: 1.04; }
      #t-cuenta { right: 260px; top: 1142px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 50px; color: var(--color_acento, #C8A96A); }
      #t-cta-line { position: absolute; left: 120px; top: 1126px; width: 120px; height: 6px; }
      #t-cta-line > div { position: absolute; left: 0; top: 0; width: 120px; height: 6px; border-radius: 3px; background: var(--color_acento, #C8A96A); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.6" data-width="1080" data-height="1920">
      <!-- TOMAS con su sonido original. pulpo: la cocina (gancho) · entrada: el neón y las escaleras · salon: el comedor -->
      <video id="toma-pulpo" class="clip toma" src="assets/clips/pulpo.mp4" data-start="0" data-duration="4.1" data-media-start="0" data-track-index="0" muted playsinline></video>
      <video id="toma-entrada" class="clip toma" src="assets/clips/entrada.mp4" data-start="4.1" data-duration="3.85" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <video id="toma-salon" class="clip toma" src="assets/clips/salon.mp4" data-start="7.95" data-duration="3.65" data-media-start="0" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>

      <div id="scrim-top" class="clip scrim" data-start="0" data-duration="2.9" data-track-index="1" data-layout-ignore></div>
      <div id="scrim-bottom" class="clip scrim" data-start="7.95" data-duration="3.65" data-track-index="1" data-layout-ignore></div>

      <h1 id="t-gancho" class="clip txt" data-start="0" data-duration="2.9" data-track-index="2"><span class="in" data-var-text="gancho">Recién salido de la cocina</span></h1>
      <div id="t-cta-line" class="clip" data-start="8.3" data-duration="3.3" data-track-index="3"><div class="in"></div></div>
      <h2 id="t-cta" class="clip txt" data-start="8.3" data-duration="3.3" data-track-index="2"><span class="in" data-var-text="cta">Reserva tu mesa</span></h2>
      <p id="t-cuenta" class="clip txt" data-start="8.6" data-duration="3" data-track-index="4"><span class="in" data-var-text="cuenta">Barracuda Gastro Bar</span></p>
    </div>
    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const conTextos = vars.textos !== false;
      const tl = gsap.timeline({ paused: true });
      const IN = (sel, at, d = 0.3) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: d, ease: "power4.out" }, at);
      const OUT = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, at);

      if (conTextos) {
        // el gancho ya está en el fotograma 0 (la miniatura) y solo se asienta
        tl.fromTo("#t-gancho .in", { opacity: 0.85, filter: "blur(2px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
        OUT("#t-gancho .in", 2.7);
        tl.to("#scrim-top", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.65);
        tl.fromTo("#scrim-bottom", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 7.95);
        tl.fromTo("#t-cta-line .in", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 8.3);
        IN("#t-cta .in", 8.35); IN("#t-cuenta .in", 8.65);
      } else {
        tl.set([".txt .in", "#t-cta-line .in", ".scrim"], { opacity: 0 }, 0);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
